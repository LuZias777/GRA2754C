	}
header{
	height:150px;
	background-color:#FBB03B;
	}
main{

	background-color:#fff;
	padding: 1em 0;
	}
footer{
	height:80px;
	background-color:#FBB03B;
	clear:both;
	}

#shape_red {
	fill: #FF1D25;
}
#shape_green {
	fill: #7AC943;
}
#shape_blue {
	fill: #3FA9F5;
}
#shape_orange {
	fill: #FF931E;
}

#segment_red:hover #shape_red {
	fill: #AD0E1A;
}
#segment_green:hover #shape_green {
	fill: #52991A;
}
#segment_blue:hover #shape_blue {
	fill: #1873AA;
}
#segment_orange:hover #shape_orange {
	fill: #B7630F;
}

	#Sooya-ro, #Gomdeuki-ro, #Ppeu-ro, #Rosie-ro {
		visibility: hidden
		
	}
	
	#rose:hover #Rosie-ro,
	#jisoo:hover #Sooya-ro,
	#jennie:hover #Gomdeuki-ro,
	#lisa:hover #Ppeu-ro
	{
         visibility: visible
	}
	
</style>
